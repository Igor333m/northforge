services:
  - type: web
    runtime: static
    name: northforgefreight-web
    buildCommand: npm install && npm run build --workspace=apps/web
    staticPublishPath: apps/web/out
    autoDeployTrigger: commit
    envVars:
      - key: NEXT_PUBLIC_HCAPTCHA_SITE_KEY
        sync: false
      - key: NEXT_PUBLIC_FORMSPREE_ID
        sync: false
